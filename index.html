<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Halay</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #sahne { position: absolute; left: 0; top: 0; background: #87c6ea; }
  body.temiz { background: transparent; }
  body.temiz #panel { display: none; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; overflow-y: auto; box-sizing: border-box;
    padding: 12px; background: #1c1f26; color: #e8e8e8; font-size: 14px; border-left: 2px solid #333; }
  #panel h3 { margin: 0 0 8px; font-size: 16px; }
  #panel label { display: block; margin: 6px 0 2px; color: #aab; font-size: 12px; }
  #panel input, #panel select { width: 100%; box-sizing: border-box; padding: 6px; background: #0f1115; color: #fff; border: 1px solid #444; border-radius: 4px; }
  #panel button { margin: 4px 4px 0 0; padding: 7px 10px; background: #2d6cdf; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #panel button.gri { background: #444; }
  #panel button.kirmizi { background: #c0392b; }
  #panel fieldset { border: 1px solid #333; border-radius: 6px; margin: 10px 0 0; padding: 6px 8px 8px; }
  #panel legend { color: #9cf; font-size: 12px; }
  #wsDurum { font-size: 12px; padding: 4px 6px; border-radius: 4px; background: #402; display: inline-block; }
  #wsDurum.acik { background: #063; }
  #pGunluk { font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; background: #0b0d10; padding: 6px; border-radius: 4px; max-height: 260px; overflow-y: auto; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="sahne" width="1080" height="1920"></canvas>

<div id="panel">
  <h3>Deneme paneli</h3>
  <span id="wsDurum">köprü: bağlı değil</span>
  <label>Ad</label><input id="pAd" value="deneme1" maxlength="24">
  <label>Yorum</label><input id="pMetin" value="HALAY" maxlength="150">
  <button data-k="yorum">Yorum gönder</button>
  <div>
    <button class="gri" data-k="hizli" data-m="HALAY">HALAY</button>
    <button class="gri" data-k="hizli" data-m="HORON">HORON</button>
    <button class="gri" data-k="hizli" data-m="ZEYBEK">ZEYBEK</button>
  </div>
  <fieldset><legend>Beğeni ve hediye</legend>
    <button data-k="b1">+1 beğeni</button>
    <button data-k="b40">+40 beğeni</button>
    <button class="kirmizi" data-k="hediye">🎁 Hediye</button>
  </fieldset>
  <fieldset><legend>Yapay zekâ cevabı (köprüden gelir gibi)</legend>
    <label>hareket</label>
    <select id="pHareket"><option>halay</option><option>horon</option><option selected>zeybek</option><option>yok</option></select>
    <label>tempo</label>
    <select id="pTempo"><option>yavas</option><option>orta</option><option>hizli</option><option>cosku</option><option selected>ayni</option></select>
    <label>söz</label><input id="pSoz" value="Efeler meydana!" maxlength="80">
    <button data-k="yapay">Gönder</button>
  </fieldset>
  <fieldset><legend>Diğer</legend>
    <button class="gri" data-k="kalabalik">+20 rastgele kişi</button>
    <button class="gri" data-k="ses">🔊 Sesi aç</button>
  </fieldset>
  <div id="pGunluk"></div>
</div>

<script>
'use strict';
// ====================== AYARLAR ======================
const W = 1080, H = 1920;
const HAREKETLER = ['halay', 'horon', 'zeybek', 'yok'];
const TEMPOLAR = ['yavas', 'orta', 'hizli', 'cosku', 'ayni'];
const TEMPO_SIRA = ['yavas', 'orta', 'hizli', 'cosku'];
const BPM = { yavas: 84, orta: 108, hizli: 136, cosku: 168 };
const BEGENI_ESIK = 40;          // 40 beğenide tempo bir kademe
const KOMUT_ARALIGI_MS = 3000;   // aynı kişi 3 sn'de bir komut
const AZAMI_AVATAR = 60;         // ekranda en çok 60 avatar
const TEMPO_SONME_MS = 45000;    // 45 sn beğeni gelmezse tempo bir kademe iner (en az "orta")

const prm = new URLSearchParams(location.search);
const TEMIZ = prm.get('temiz') === '1';
const SES_KAPALI = prm.get('ses') === '0';
const WS_ADRES = location.protocol === 'http:' && location.hostname === '127.0.0.1'
  ? 'ws://' + location.host
  : 'ws://127.0.0.1:' + (Number(prm.get('port')) || 8765);
if (TEMIZ) document.body.classList.add('temiz');

// ====================== DURUM ======================
const durum = {
  dans: 'halay', tempo: 'orta', avatarlar: [], basi: null,
  begeniToplam: 0, begeniKova: 0, sonBegeni: Date.now(),
  sonKomut: new Map(), balon: null, duyuru: null, faz: 0,
  sayac: { kabul: 0, red: 0 },
};

// ====================== KURAL (ortak.mjs ile aynı) ======================
function sadelestir(m) {
  return String(m ?? '').toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u')
    .replace(/[âà]/g, 'a').replace(/[îì]/g, 'i').replace(/[ûù]/g, 'u')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '');
}
function kuralKomutu(metin) {
  const s = sadelestir(metin);
  let hareket = null, tempo = null;
  if (/\bha+la+y+\b/.test(s)) hareket = 'halay';
  else if (/\bho+ro+n+\b/.test(s)) hareket = 'horon';
  else if (/\bze+y+be+k+\b/.test(s)) hareket = 'zeybek';
  if (/\bcosku\w*/.test(s)) tempo = 'cosku';
  else if (/\bhizl[ia]\w*/.test(s)) tempo = 'hizli';
  else if (/\byavas\w*/.test(s)) tempo = 'yavas';
  else if (/^\s*orta\s*[.!]*\s*$/.test(s)) tempo = 'orta';
  if (!hareket && !tempo) return null;
  return { hareket: hareket ?? 'yok', tempo: tempo ?? 'ayni' };
}
const hareketSuz = (v) => HAREKETLER.includes(v) ? v : 'yok';
const tempoSuz = (v) => TEMPOLAR.includes(v) ? v : 'ayni';
const temizMetin = (v, n) => String(v ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, n);

// ====================== TEK GİRİŞ KAPISI ======================
// olay({tur, ad, metin, adet, hareket, tempo, soz})
//   tur: 'yorum' | 'begeni' | 'hediye' | 'yapay'
function olay(o) {
  const sonuc = olayIsle(o);
  if (sonuc.kabul) durum.sayac.kabul++; else durum.sayac.red++;
  gunlukYaz((sonuc.kabul ? '✔ ' : '✖ ') + (o && o.tur) + ' ' + (o && o.ad ? o.ad : '') + ' → ' + (sonuc.neden || 'tamam'));
  return sonuc;
}
window.olay = olay;

function olayIsle(o) {
  if (!o || typeof o !== 'object') return { kabul: false, neden: 'gecersiz' };
  const tur = String(o.tur || '');
  if (!['yorum', 'begeni', 'hediye', 'yapay'].includes(tur)) return { kabul: false, neden: 'bilinmeyen tur' };
  const ad = temizMetin(o.ad, 24) || 'izleyici';
  const metin = temizMetin(o.metin, 150);
  const adet = Math.max(1, Math.min(10000, Math.floor(Number(o.adet) || 1)));
  const simdi = Date.now();
  let zaman = Number(o.zaman);
  if (!Number.isFinite(zaman) || zaman > simdi || zaman < simdi - 15000) zaman = simdi;
  sesBaslat();

  if (tur === 'begeni') { begeniEkle(adet); return { kabul: true }; }
  if (tur === 'hediye') { hediyeIsle(ad, metin || 'hediye', adet); return { kabul: true }; }

  // yorum ve yapay: komut sayılır, kişi başı 3 sn sınırı
  let hareket, tempo, soz = '';
  if (tur === 'yorum') {
    const k = kuralKomutu(metin);
    if (!k) return { kabul: false, neden: 'kurala uymuyor (yapay zekâ köprüde)' };
    hareket = k.hareket; tempo = k.tempo;
  } else {
    hareket = hareketSuz(o.hareket); tempo = tempoSuz(o.tempo); soz = temizMetin(o.soz, 80);
  }
  const once = durum.sonKomut.get(ad);
  if (once !== undefined && zaman - once < KOMUT_ARALIGI_MS) return { kabul: false, neden: '3 sn sınırı' };
  durum.sonKomut.set(ad, zaman);
  if (durum.sonKomut.size > 5000) for (const [k, t] of durum.sonKomut) if (simdi - t > KOMUT_ARALIGI_MS) durum.sonKomut.delete(k);

  uygula(ad, hareket, tempo);
  if (soz) balonGoster(ad, soz);
  return { kabul: true };
}

function uygula(ad, hareket, tempo) {
  const var_ = avatarBul(ad);
  if (var_) var_.son = Date.now();
  if (hareket === 'halay') {
    if (!var_) katil(ad); else dansDegistir('halay', ad);
  } else if (hareket === 'horon' || hareket === 'zeybek') {
    dansDegistir(hareket, ad);
  }
  if (tempo !== 'ayni') tempoAyarla(tempo, ad);
}

// ====================== OYUN KURALLARI ======================
function avatarBul(ad) { return durum.avatarlar.find((a) => a.ad === ad); }

function adRengi(ad) {
  let h = 0;
  for (const ch of ad) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return h;
}

function katil(ad) {
  if (durum.avatarlar.length >= AZAMI_AVATAR) {
    // yer aç: en uzun süredir hareketsiz olan (halay başı hariç) sıradan çıkar
    let eski = null;
    for (const a of durum.avatarlar) if (a.ad !== durum.basi && (!eski || a.son < eski.son)) eski = a;
    if (eski) {
      durum.avatarlar.splice(durum.avatarlar.indexOf(eski), 1);
      gunlukYaz('↩ ' + eski.ad + ' yer açmak için sıradan çıktı');
    }
  }
  const h = adRengi(ad);
  const a = { ad, h, son: Date.now(), x: -120, y: 1500, giris: performance.now() };
  durum.avatarlar.push(a);
  siraDuzenle();
  return a;
}

function dansDegistir(dans, ad) {
  if (durum.dans === dans) return;
  durum.dans = dans;
  duyur(dans.toLocaleUpperCase('tr') + '!', ad + ' dansı değiştirdi', '#ffd23f');
}

function tempoAyarla(t, ad) {
  if (!TEMPO_SIRA.includes(t) || durum.tempo === t) return;
  durum.tempo = t;
  duyur('TEMPO: ' + tempoYazi(t), ad ? ad + ' istedi' : '', '#ff6b3d');
}

function begeniEkle(adet) {
  durum.begeniToplam += adet;
  durum.begeniKova += adet;
  durum.sonBegeni = Date.now();
  while (durum.begeniKova >= BEGENI_ESIK) {
    durum.begeniKova -= BEGENI_ESIK;
    const i = TEMPO_SIRA.indexOf(durum.tempo);
    if (i < TEMPO_SIRA.length - 1) tempoAyarla(TEMPO_SIRA[i + 1], '40 beğeni');
  }
}

function hediyeIsle(ad, hediye, adet) {
  if (!avatarBul(ad)) katil(ad);
  const a = avatarBul(ad);
  a.son = Date.now();
  durum.basi = ad;
  siraDuzenle();
  duyur('🎁 ' + ad, 'mendili aldı, halay başı oldu!', '#ff3b5c');
  balonGoster('', ad + ' ' + (adet > 1 ? adet + ' ' : '') + hediye + ' gönderdi! Mendil artık onda, ben kenara geçiyorum.');
}

function siraDuzenle() {
  if (durum.basi) {
    const i = durum.avatarlar.findIndex((a) => a.ad === durum.basi);
    if (i > 0) durum.avatarlar.unshift(durum.avatarlar.splice(i, 1)[0]);
    if (i < 0) durum.basi = null;
  }
}

function tempoSonmesi() {
  const i = TEMPO_SIRA.indexOf(durum.tempo);
  if (i > 1 && Date.now() - durum.sonBegeni > TEMPO_SONME_MS) {
    durum.tempo = TEMPO_SIRA[i - 1];
    durum.sonBegeni = Date.now();
    duyur('TEMPO: ' + tempoYazi(durum.tempo), 'beğeni gelmedi, tempo düştü', '#9ad');
  }
}

function tempoYazi(t) { return { yavas: 'YAVAŞ', orta: 'ORTA', hizli: 'HIZLI', cosku: 'COŞKU' }[t] || t; }
function duyur(baslik, alt, renk) { durum.duyuru = { baslik, alt, renk, t: performance.now() }; }
function balonGoster(ad, soz) { durum.balon = { ad, soz, t: performance.now() }; }

window.oyunDurumu = () => ({
  avatar: durum.avatarlar.length, adlar: durum.avatarlar.map((a) => a.ad), dans: durum.dans, tempo: durum.tempo,
  basi: durum.basi, begeniToplam: durum.begeniToplam, begeniKova: durum.begeniKova,
  balon: durum.balon && durum.balon.soz, sayac: { ...durum.sayac }, ses: !!(ses.ctx && ses.ctx.state === 'running'),
});

// ====================== YERLEŞİM ======================
// Yılan biçimli sıra: halay başı ön sıranın sağ ucunda, sıra sola doğru uzar.
const SIRALAR = [
  { y: 1610, s: 1.00 }, { y: 1452, s: 0.88 }, { y: 1312, s: 0.77 }, { y: 1188, s: 0.67 }, { y: 1078, s: 0.58 },
];
const SIRA_BASI_YER = 13;
function yuva(i) {
  const r = Math.min(SIRALAR.length - 1, Math.floor(i / SIRA_BASI_YER));
  const k = i - r * SIRA_BASI_YER;
  const { y, s } = SIRALAR[r];
  const ara = 70 * s;
  const sol = 540 - ara * (SIRA_BASI_YER - 1) / 2;
  const x = r % 2 === 0 ? sol + ara * (SIRA_BASI_YER - 1 - k) : sol + ara * k;
  return { x, y, s, r };
}

// ====================== ÇİZİM ======================
const tuval = document.getElementById('sahne');
const c = tuval.getContext('2d');
const arka = document.createElement('canvas');
arka.width = W; arka.height = H;
arkaPlanCiz(arka.getContext('2d'));

function boyutla() {
  const panelW = TEMIZ ? 0 : 320;
  const aw = Math.max(100, innerWidth - panelW), ah = innerHeight;
  const o = Math.min(aw / W, ah / H);
  tuval.style.width = W * o + 'px';
  tuval.style.height = H * o + 'px';
  tuval.style.left = (aw - W * o) / 2 + 'px';
  tuval.style.top = (ah - H * o) / 2 + 'px';
}
addEventListener('resize', boyutla);
boyutla();

function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function arkaPlanCiz(g) {
  // gökyüzü
  let gr = g.createLinearGradient(0, 0, 0, 1000);
  gr.addColorStop(0, '#3d8fd6'); gr.addColorStop(0.7, '#9fd3f2'); gr.addColorStop(1, '#f6dfb0');
  g.fillStyle = gr; g.fillRect(0, 0, W, 1000);
  g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(860, 640, 70, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)';
  for (const [x, y, s] of [[160, 610, 1], [700, 700, .8], [420, 560, .6]]) {
    g.beginPath(); g.ellipse(x, y, 70 * s, 26 * s, 0, 0, 7); g.ellipse(x + 50 * s, y - 14 * s, 50 * s, 26 * s, 0, 0, 7); g.ellipse(x - 50 * s, y + 4 * s, 44 * s, 20 * s, 0, 0, 7); g.fill();
  }
  // dağlar
  g.fillStyle = '#7a9a6a';
  g.beginPath(); g.moveTo(0, 900); g.lineTo(150, 770); g.lineTo(330, 860); g.lineTo(520, 740); g.lineTo(760, 870); g.lineTo(920, 780); g.lineTo(1080, 860); g.lineTo(1080, 960); g.lineTo(0, 960); g.fill();
  g.fillStyle = '#5f8455';
  g.beginPath(); g.moveTo(0, 930); g.quadraticCurveTo(300, 850, 560, 920); g.quadraticCurveTo(820, 980, 1080, 900); g.lineTo(1080, 980); g.lineTo(0, 980); g.fill();
  // köy evleri (taş duvar, kiremit çatı)
  const evler = [[30, 860, 150, 110], [205, 880, 120, 90], [760, 870, 140, 105], [920, 850, 140, 125]];
  for (const [x, y, w, h] of evler) {
    g.fillStyle = '#d9c8a6'; g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(120,100,70,.35)'; g.lineWidth = 2;
    for (let yy = y + 16; yy < y + h; yy += 16) { g.beginPath(); g.moveTo(x, yy); g.lineTo(x + w, yy); g.stroke(); }
    g.fillStyle = '#b5482e'; g.beginPath(); g.moveTo(x - 14, y + 4); g.lineTo(x + w / 2, y - 48); g.lineTo(x + w + 14, y + 4); g.fill();
    g.fillStyle = '#4a3020'; g.fillRect(x + w / 2 - 14, y + h - 46, 28, 46);
    g.fillStyle = '#6fb3d9'; g.fillRect(x + 14, y + 22, 24, 22); g.fillRect(x + w - 38, y + 22, 24, 22);
  }
  // çınar ağacı
  g.fillStyle = '#6b4a2b'; g.fillRect(600, 820, 26, 160);
  g.fillStyle = '#3f7d3a';
  for (const [x, y, r] of [[613, 790, 80], [560, 820, 55], [670, 815, 58], [613, 740, 60]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  // meydan zemini
  gr = g.createLinearGradient(0, 960, 0, H);
  gr.addColorStop(0, '#c9a878'); gr.addColorStop(1, '#a8845a');
  g.fillStyle = gr; g.fillRect(0, 960, W, H - 960);
  g.strokeStyle = 'rgba(90,60,30,.18)'; g.lineWidth = 2;
  for (let y = 1000; y < H; y += 48 + (y - 1000) * 0.05) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = 'rgba(255,240,210,.18)';
  g.beginPath(); g.ellipse(540, 1380, 520, 380, 0, 0, 7); g.fill();
  // çeşme
  g.fillStyle = '#bdb6a8'; rr(g, 440, 930, 120, 70, 6); g.fill();
  g.fillStyle = '#9a9384'; g.fillRect(470, 890, 60, 44);
  g.fillStyle = '#7fc3e8'; g.fillRect(448, 980, 104, 12);
  g.strokeStyle = '#7fc3e8'; g.lineWidth = 4; g.beginPath(); g.moveTo(500, 915); g.quadraticCurveTo(510, 940, 506, 978); g.stroke();
  // bayrak süsleri (renkli üçgenler)
  const renkler = ['#e63946', '#f1c40f', '#2ecc71', '#3498db', '#ffffff'];
  for (const [y0, sark] of [[800, 60], [860, 40]]) {
    g.strokeStyle = '#333'; g.lineWidth = 2; g.beginPath();
    for (let x = 0; x <= W; x += 10) { const y = y0 + Math.sin((x / W) * Math.PI) * sark; x === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
    for (let x = 20, i = 0; x < W; x += 46, i++) {
      const y = y0 + Math.sin((x / W) * Math.PI) * sark;
      g.fillStyle = renkler[i % renkler.length];
      g.beginPath(); g.moveTo(x - 14, y); g.lineTo(x + 14, y); g.lineTo(x, y + 30); g.fill();
    }
  }
}

const TENLER = ['#f1c7a5', '#e0ac85', '#c98c62', '#a8714c'];
const KIYAFET = ['#c0392b', '#2471a3', '#1e8449', '#7d3c98', '#d35400', '#b7950b', '#a93226', '#117a65'];
const KUSAK = ['#f4d03f', '#e74c3c', '#ecf0f1', '#5dade2', '#f39c12'];

function cizgi(x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

// x,y: ayak hizası. p: {bob, egim, bacak, sol:[x,y], sag:[x,y]} yerel birimde
function kisiCiz(x, y, s, gor, p) {
  c.save();
  c.translate(x, y + p.bob * s); c.scale(s, s); c.rotate(p.egim);
  c.lineCap = 'round'; c.lineJoin = 'round';
  // şalvar ve bacaklar
  c.fillStyle = gor.salvar;
  c.beginPath(); c.moveTo(-17, -66); c.lineTo(17, -66); c.lineTo(13 + p.bacak * 7, -6); c.lineTo(2, -30); c.lineTo(-13 - p.bacak * 7, -6); c.closePath(); c.fill();
  c.fillStyle = '#2b1d14';
  c.beginPath(); c.ellipse(-12 - p.bacak * 7, -3, 10, 5, 0, 0, 7); c.ellipse(12 + p.bacak * 7, -3, 10, 5, 0, 0, 7); c.fill();
  // gövde
  c.fillStyle = gor.gomlek; rr(c, -17, -122, 34, 60, 10); c.fill();
  c.fillStyle = gor.yelek; c.fillRect(-17, -118, 9, 52); c.fillRect(8, -118, 9, 52);
  c.fillStyle = gor.kusak; c.fillRect(-17, -72, 34, 9);
  // kollar
  c.strokeStyle = gor.gomlek; c.lineWidth = 9;
  cizgi(-14, -112, p.sol[0], p.sol[1]); cizgi(14, -112, p.sag[0], p.sag[1]);
  c.fillStyle = gor.ten;
  c.beginPath(); c.arc(p.sol[0], p.sol[1], 5, 0, 7); c.arc(p.sag[0], p.sag[1], 5, 0, 7); c.fill();
  // baş
  if (gor.yz) {
    c.fillStyle = '#d7f6f6'; rr(c, -17, -158, 34, 32, 9); c.fill();
    c.fillStyle = '#0b3b45'; rr(c, -13, -150, 26, 14, 6); c.fill();
    c.fillStyle = '#4ff3ff'; c.beginPath(); c.arc(-6, -143, 3.2, 0, 7); c.arc(6, -143, 3.2, 0, 7); c.fill();
    c.strokeStyle = '#d7f6f6'; c.lineWidth = 3; cizgi(0, -158, 0, -170);
    c.fillStyle = '#ff4d6d'; c.beginPath(); c.arc(0, -172, 4.5, 0, 7); c.fill();
  } else {
    c.fillStyle = gor.ten; c.beginPath(); c.arc(0, -138, 16, 0, 7); c.fill();
    c.fillStyle = '#222'; c.beginPath(); c.arc(-5, -140, 2, 0, 7); c.arc(5, -140, 2, 0, 7); c.fill();
    if (gor.biyik) { c.strokeStyle = '#2b1d14'; c.lineWidth = 3; cizgi(-6, -131, 6, -131); }
    if (gor.bas === 0) { c.fillStyle = '#222'; c.beginPath(); c.arc(0, -146, 16, Math.PI, 0); c.fill(); }
    else if (gor.bas === 1) { c.fillStyle = gor.kusak; c.beginPath(); c.arc(0, -144, 17, Math.PI * 1.05, -0.05); c.fill(); c.fillRect(-17, -148, 34, 6); }
    else { c.fillStyle = '#3b2a20'; c.fillRect(-17, -156, 34, 9); c.fillRect(-20, -150, 40, 4); }
  }

}

function gorunus(h) {
  return {
    ten: TENLER[h % 4], gomlek: KIYAFET[(h >>> 3) % KIYAFET.length], yelek: '#2c2c34',
    kusak: KUSAK[(h >>> 6) % KUSAK.length], salvar: '#26232b', bas: (h >>> 9) % 3, biyik: ((h >>> 11) & 1) === 1,
  };
}
const YZ_GOR = { ten: '#d7f6f6', gomlek: '#14a3a3', yelek: '#0b5f6b', kusak: '#4ff3ff', salvar: '#1d3540', yz: true };

// dans duruşu; f: vuruş fazı, i: sıradaki yer (küçük kayma)
function poz(f, i, bas) {
  const d = durum.dans;
  if (d === 'horon') {
    const t = f * Math.PI * 2;
    return { bob: -Math.abs(Math.sin(t)) * 6 - Math.abs(Math.sin(t * 2)) * 2, egim: Math.sin(t * 2) * 0.035, bacak: Math.sin(t) * 0.6,
      sol: [-34, -114 + Math.sin(t * 2) * 3], sag: bas ? [26, -178 + Math.sin(t * 3) * 6] : [34, -114 + Math.sin(t * 2) * 3] };
  }
  if (d === 'zeybek') {
    const z = (f / 2 + i * 0.03) * Math.PI;
    const dal = (1 - Math.cos(z)) * 7;
    return { bob: dal, egim: Math.sin(z) * 0.14, bacak: Math.sin(z) * 0.9,
      sol: [-40, -172 + dal], sag: bas ? [30, -186] : [40, -172 + dal] };
  }
  const t = f * Math.PI / 2;
  const sall = Math.sin(t) * 5;
  return { bob: -Math.abs(Math.sin(f * Math.PI)) * 7, egim: Math.sin(t) * 0.05, bacak: Math.sin(f * Math.PI) * 0.7,
    sol: [-33 + sall * 0.3, -86], sag: bas ? [26, -180 + Math.sin(f * Math.PI * 2) * 5] : [33 + sall * 0.3, -86] };
}

function mendilCiz(x, y, s, zaman) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#e8142c'; c.strokeStyle = '#ffd23f'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, 0);
  for (let k = 0; k <= 6; k++) { const u = k / 6; c.lineTo(10 + u * 46, -18 + Math.sin(zaman * 9 + u * 4) * (6 + u * 12) - u * 8); }
  for (let k = 6; k >= 0; k--) { const u = k / 6; c.lineTo(10 + u * 46, 16 + Math.sin(zaman * 9 + u * 4 + 0.6) * (6 + u * 12) - u * 8); }
  c.closePath(); c.fill(); c.stroke();
  c.restore();
}

  c.strokeStyle = '#8e5a2b'; c.lineWidth = 7 * s; cizgi(zx + 4 * s, zy - 132 * s, zx + 48 * s, zy - 170 * s);
  c.fillStyle = '#8e5a2b'; c.beginPath(); c.moveTo(zx + 44 * s, zy - 176 * s); c.lineTo(zx + 62 * s, zy - 182 * s); c.lineTo(zx + 52 * s, zy - 162 * s); c.fill();

}

function avatarlarCiz(simdi, dt, f) {
  const n = durum.avatarlar.length;
  const yzBasta = !durum.basi;
  const kayma = yzBasta ? 1 : 0;
  // hedef konumlar
  durum.avatarlar.forEach((a, i) => {
    const y = yuva(i + kayma);
    if (a.x < -100) { a.x = y.r % 2 === 0 ? -80 : W + 80; a.y = y.y; }
    const k = 1 - Math.pow(0.003, dt);
    a.x += (y.x - a.x) * k; a.y += (y.y - a.y) * k; a.s = y.s; a.r = y.r;
  });
  const cizilecek = durum.avatarlar.map((a, i) => ({ a, i: i + kayma }));
  if (yzBasta) cizilecek.push({ yz: true, i: 0 });
  // arka sıradan öne
  cizilecek.sort((p, q) => yuva(q.i).y - yuva(p.i).y);
  const zaman = simdi / 1000;
  for (const o of cizilecek) {
    const bas = o.i === 0;
    if (o.yz) {
      const y = yuva(0);
      const p = poz(f, 0, true);
      kisiCiz(y.x, y.y, y.s * 1.05, YZ_GOR, p);
      mendilCiz(y.x + p.sag[0] * y.s, y.y + (p.sag[1] + p.bob) * y.s, y.s, zaman);
      yaziCiz('🤖 YZ', y.x, y.y + 22, 22, '#4ff3ff', 'center', 900, 4);
      continue;
    }
    const a = o.a;
    const p = poz(f, o.i, bas);
    if (!a.gor) a.gor = gorunus(a.h);
    kisiCiz(a.x, a.y, a.s, a.gor, p);
    if (bas) {
      mendilCiz(a.x + p.sag[0] * a.s, a.y + (p.sag[1] + p.bob) * a.s, a.s, zaman);
      yaziCiz('★ ' + kisalt(a.ad, 12), a.x, a.y + 24, 24, '#ffd23f', 'center', 900, 5);
    } else {
      // komşu adlar üst üste binmesin: tek/çift sıra iki ayrı yükseklikte
      yaziCiz(kisalt(a.ad, 8), a.x, a.y + (o.i % 2 ? 34 : 14) * a.s, Math.round(16 * a.s + 3), '#fff', 'center', 700, 3);
    }
  }
  // yapay zekâ kenarda çağırıcı (hediye sahibi halay başıyken)
  if (!yzBasta) {
    const x = 930, y = 1800, s = 0.95;
    kisiCiz(x, y, s, YZ_GOR, { bob: Math.sin(f * Math.PI) * 2, egim: 0, bacak: 0, sol: [-24, -80], sag: [24, -168 + Math.sin(zaman * 6) * 8] });
    yaziCiz('🤖 YZ çağırıcı', x, y + 26, 22, '#4ff3ff', 'center', 900, 4);
  }
}

let onceki = performance.now();

function kare(simdi) {

}

// ====================== SES (WebAudio: davul + zurna) ======================
const ses = { ctx: null, ana: null, adim: 0, sonraki: 0, gurultu: null };
// Hicaz dizisi (Re): D Eb F# G A Bb C D
const NOTA = { d: 293.66, e: 311.13, f: 369.99, g: 392.0, a: 440.0, b: 466.16, c: 523.25, D: 587.33, E: 622.25 };
const DESEN = {
  // davul: 1 = güm (tokmak), 2 = tak (çubuk), 0 = boş
  halay: { davul: [1, 0, 2, 0, 1, 2, 2, 0], zurna: 'a.ab a.gf g.fe d...  a.ab c.ba g.fg a...'.replace(/ /g, '') },
  horon: { davul: [1, 2, 2, 1, 2, 2, 2], zurna: 'DcbaDcb aagfaga gfedfge fed.d..'.replace(/ /g, '') },
  zeybek: { davul: [1, 0, 0, 2, 0, 0, 1, 0, 2], zurna: 'd..f..g..a....g.f.g..f..e..d......'.replace(/ /g, '') },
};

function sesBaslat() {
  if (SES_KAPALI) return;
  try {
    if (!ses.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ses.ctx = new AC();
      ses.ana = ses.ctx.createGain(); ses.ana.gain.value = 0.55; ses.ana.connect(ses.ctx.destination);
      const uz = ses.ctx.sampleRate * 0.5, buf = ses.ctx.createBuffer(1, uz, ses.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < uz; i++) d[i] = Math.random() * 2 - 1;
      ses.gurultu = buf;
      ses.sonraki = ses.ctx.currentTime + 0.1;
      setInterval(sesZamanla, 25);
    }
    if (ses.ctx.state === 'suspended') ses.ctx.resume().catch(() => {});
  } catch (e) { /* ses yoksa oyun sürer */ }
}

function gum(t, guc) {
  const o = ses.ctx.createOscillator(), g = ses.ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
  g.gain.setValueAtTime(0.9 * guc, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  o.connect(g).connect(ses.ana); o.start(t); o.stop(t + 0.42);
  gurultuVur(t, 400, 'lowpass', 0.35 * guc, 0.08);
}
function tak(t, guc) { gurultuVur(t, 2500, 'highpass', 0.35 * guc, 0.05); }
function gurultuVur(t, frek, tip, guc, sure) {
  const k = ses.ctx.createBufferSource(), f = ses.ctx.createBiquadFilter(), g = ses.ctx.createGain();
  k.buffer = ses.gurultu; f.type = tip; f.frequency.value = frek;
  g.gain.setValueAtTime(guc, t); g.gain.exponentialRampToValueAtTime(0.001, t + sure);
  k.connect(f).connect(g).connect(ses.ana); k.start(t); k.stop(t + sure + 0.02);
}
function zurna(t, frek, sure) {
  const o = ses.ctx.createOscillator(), o2 = ses.ctx.createOscillator(), f = ses.ctx.createBiquadFilter(), g = ses.ctx.createGain();
  const vib = ses.ctx.createOscillator(), vg = ses.ctx.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = frek; o2.frequency.value = frek * 1.003;
  vib.frequency.value = 5.5; vg.gain.value = frek * 0.012; vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
  f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.13, t + 0.02);
  g.gain.setValueAtTime(0.13, t + sure * 0.85); g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  o.connect(f); o2.connect(f); f.connect(g).connect(ses.ana);
  for (const x of [o, o2, vib]) { x.start(t); x.stop(t + sure + 0.02); }
}

function sesZamanla() {
  if (!ses.ctx || ses.ctx.state !== 'running') return;
  const ileri = ses.ctx.currentTime + 0.15;
  if (ses.sonraki < ses.ctx.currentTime - 0.5) ses.sonraki = ses.ctx.currentTime + 0.05;
  while (ses.sonraki < ileri) {
    const desen = DESEN[durum.dans] || DESEN.halay;
    const carpim = durum.dans === 'zeybek' ? 0.6 : 1;
    const adimSure = 60 / (BPM[durum.tempo] * carpim) / 2; // sekizlik
    const guc = durum.tempo === 'cosku' ? 1 : 0.85;
    const v = desen.davul[ses.adim % desen.davul.length];
    if (v === 1) gum(ses.sonraki, guc); else if (v === 2) tak(ses.sonraki, guc);
    const m = desen.zurna, ch = m[ses.adim % m.length];
    if (NOTA[ch]) {
      let uz = 1; while (m[(ses.adim + uz) % m.length] === '.' && uz < 6) uz++;
      zurna(ses.sonraki, NOTA[ch], adimSure * uz * 0.95);
    }
    ses.adim++;
    ses.sonraki += adimSure;
  }
}

    case 'hediye': olay({ tur: 'hediye', ad, metin: 'Gül', adet: 1 }); break;
    case 'yapay': olay({ tur: 'yapay', ad, metin: '(panel)', hareket: $('pHareket').value, tempo: $('pTempo').value, soz: $('pSoz').value }); break;
    case 'kalabalik': for (let i = 0; i < 20; i++) olay({ tur: 'yorum', ad: 'izleyici' + Math.floor(Math.random() * 100000), metin: 'HALAY' }); break;
    case 'ses': b.textContent = '🔊 Ses açık'; break;
  }
});
if (SES_KAPALI) $('pGunluk').textContent = '(?ses=0: ses kapalı)';
</script>
